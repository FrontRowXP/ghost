name: Gather checks

on:
  pull_request:
  push:
    branches: [main, 'gather/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gather-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Gather compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_DAEMON: 'false'
      NX_NATIVE_COMMAND_RUNNER: 'false'
      NX_PARALLEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.23.3
          install: 'false'
      - name: Bootstrap the pinned workspace
        run: pnpm bootstrap
      - name: Build production dependencies
        run: pnpm --filter-prod 'ghost^...' -r run build
      - name: Build the production frontend and backend
        run: pnpm build:production
      - name: Configuration and publishing regression tests
        working-directory: ghost/core
        run: pnpm exec vitest run test/unit/shared/config/utils.test.js test/unit/server/models/post.test.js test/unit/frontend/web/middleware/serve-public-file.test.js --maxWorkers=2
      - name: Private NAS gateway boundary tests
        working-directory: ghost/core
        run: node --import=tsx --conditions=source --test scripts/gather-assets.test.mjs scripts/gather-origin.test.mjs
      - name: Frontro staff authentication boundary tests
        run: node --experimental-strip-types --test ghost/core/scripts/frontro-auth.test.cjs ghost/core/scripts/frontro-auth-client.test.cjs ghost/core/scripts/frontro-auth-serialization.test.cjs
      - name: Install the isolated acceptance browser
        run: pnpm --filter @tryghost/admin exec playwright install --with-deps chromium
      - name: Frontro authentication and older-backend browser acceptance
        run: pnpm --filter @tryghost/admin test:acceptance src/auth/frontro/frontro-signin.acceptance.test.tsx src/auth/signin.acceptance.test.tsx src/layout/frontro-signout.acceptance.test.tsx
      - name: Deployment qualification gate tests
        run: python3 -m unittest discover -s infra/deployer -p 'test_*.py'
      - name: Build the bundled public search frontend
        run: pnpm --filter @tryghost/sodo-search run build
      - name: Build and qualify Frontro public branding
        run: |
          pnpm --filter @tryghost/portal run build
          pnpm --filter @tryghost/admin-toolbar run build
          node --test ghost/core/scripts/frontro-branding.test.mjs
          pnpm --filter @tryghost/portal exec vitest run test/portal-links.test.jsx
          pnpm --filter @tryghost/admin-toolbar exec vitest run test/admin-toolbar.test.js
          pnpm --filter ghost exec vitest run test/unit/frontend/utils/frontend-apps.test.ts test/unit/frontend/helpers/ghost-head.test.js test/unit/frontend/services/rss/generate-feed.test.js test/unit/server/services/mail/ghost-mailer.test.js test/unit/server/services/auth/session/session-service.test.js --maxWorkers=2
      - name: Reject inherited publication workflows
        run: |
          unexpected=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name gather.yml)
          test -z "$unexpected"
